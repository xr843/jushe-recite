<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>俱舍论本颂 · 背诵辅助</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#8a6d3b">
<meta name="description" content="按品浏览俱舍论本颂、按音频自动连播,辅助每日背诵">
<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="俱舍论本颂">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="topbar">
    <button class="hamburger" id="btnMenu" title="目录" aria-label="打开品目录">☰</button>
    <div class="brand">俱舍论本颂<small>背诵辅助</small></div>
    <div class="tabs">
      <button class="tab active" data-view="all">全部颂</button>
      <button class="tab" data-view="today">今日背诵<span class="badge" id="tabBadge">0</span></button>
      <button class="tab" data-view="train">练习<span class="badge" id="trainBadge">0</span></button>
    </div>
    <div class="search"><input id="searchInput" type="search" placeholder="搜索偈颂…" aria-label="搜索偈颂正文" autocomplete="off"></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="btnSettings" title="设置" aria-label="设置">⚙</button>
  </div>
  <div class="drawer-mask" id="drawerMask"></div>

  <div class="layout">
    <aside class="col-left" id="catalog"></aside>
    <main class="col-main" id="mainList"></main>
    <aside class="col-right">
      <div class="right-head">
        <h3>今日背诵</h3>
        <div class="sel-count" id="selCount">已选 0 颂</div>
      </div>
      <div class="today-list" id="todayList"></div>
      <div class="player">
        <div class="now-playing" id="nowPlaying" aria-live="polite" role="status">未开始</div>
        <div class="controls">
          <button class="pbtn" id="btnPrev" title="上一颂" aria-label="上一颂">⏮</button>
          <button class="pbtn main" id="btnSeqPlay" title="连播/暂停" aria-label="连播或暂停">▶</button>
          <button class="pbtn" id="btnNext" title="下一颂" aria-label="下一颂">⏭</button>
          <button class="pbtn loop" id="btnSeqLoop" title="列表循环" aria-label="列表循环">🔁</button>
        </div>
        <button class="clear" id="btnClear">清空列表</button>
      </div>
    </aside>
  </div>

  <!-- 设置 -->
  <div class="modal-mask" id="settingsMask">
    <div class="modal">
      <h3>设置</h3>
      <div class="row">
        <span>播放速度</span>
        <span><input type="range" id="rateRange" min="0.5" max="1.5" step="0.05"> <b id="rateVal">1</b> ×</span>
      </div>
      <div class="row">
        <span>音量</span>
        <span><input type="range" id="volRange" min="0" max="1" step="0.05"> <b id="volVal">100</b> %</span>
      </div>
      <div class="row">
        <span>每日新颂上限</span>
        <span><input type="range" id="newPerDayRange" min="0" max="20" step="1"> <b id="newPerDayVal">6</b> 颂</span>
      </div>
      <div class="offline-sec">
        <div class="offline-head">进度备份 <span class="offline-hint">熟练度/选颂存在本机，清缓存会丢，记得导出</span></div>
        <div style="display:flex;gap:10px;margin-top:8px">
          <button id="btnExport" style="flex:1;border:1px solid var(--accent-soft);background:var(--paper);color:var(--accent);padding:6px 0;border-radius:8px;font-size:13px;cursor:pointer">导出进度</button>
          <button id="btnImport" style="flex:1;border:1px solid var(--accent-soft);background:var(--paper);color:var(--accent);padding:6px 0;border-radius:8px;font-size:13px;cursor:pointer">导入进度</button>
          <input type="file" id="importFile" accept="application/json,.json" style="display:none">
        </div>
      </div>
      <div class="offline-sec">
        <div class="offline-head">离线音频 <span class="offline-hint" id="offlineHint">下载后该品可无网背诵</span></div>
        <div class="offline-list" id="offlineList"></div>
      </div>
      <div style="font-size:11px;color:var(--ink-soft);text-align:center;margin-top:14px;padding-top:10px;border-top:1px solid var(--line)">
        版本 <code id="appVersion" style="font-family:monospace">2026-06-29-r15</code>
        　<button id="btnDiag" style="font-size:11px;background:transparent;border:1px solid var(--line);padding:2px 8px;border-radius:4px;color:var(--ink-soft);cursor:pointer">诊断</button>
        　<button id="btnReset" style="font-size:11px;background:transparent;border:1px solid #b5462f;padding:2px 8px;border-radius:4px;color:#b5462f;cursor:pointer">重置应用</button>
      </div>
      <button class="close" id="btnCloseSettings">完成</button>
    </div>
  </div>

<audio id="audio" preload="auto"></audio>

<script src="verses.js"></script>
<script src="timings.js"></script>
<script src="trans.js"></script>
<script src="app.js"></script>

</body>
</html>
